version: '3.8'
services:
  cassandra:
    image: cassandra:latest
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./data:/data
      - ./init.cql:/init.cql
    command: "bash -c 'sleep 30 && cqlsh -f /init.cql'"
    environment:
      - CASSANDRA_CLUSTER_NAME=recsys_cluster

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - cassandra
      - redis
      - kafka
    environment:
      - SPRING_CASSANDRA_CONTACT_POINTS=cassandra
      - SPRING_REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  recommender:
    build:
      context: ./recommender
      dockerfile: Dockerfile
    depends_on:
      - kafka
      - cassandra
      - redis

volumes:
  cassandra-data:
  redis-data: